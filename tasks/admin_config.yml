---
- name: Wait for Radarr API to become available.
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 7878
    delay: 5
    timeout: 60

- name: Read Radarr config to extract API Key.
  ansible.builtin.slurp:
    src: /var/lib/radarr/config.xml
  register: _radarr_config

- name: Extract API Key.
  ansible.builtin.set_fact:
    radarr_api_key: "{{ (_radarr_config.content | b64decode) | regex_findall('<ApiKey>(.*?)</ApiKey>') | first }}"

- name: Get current host configuration
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/config/host"
    method: GET
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    status_code: 200
  register: _radarr_host_config

- name: Ensure admin user is present and set Forms autentication.
  vars:
    _radarr_desired_host_config: "{{ _radarr_host_config.json | combine(radarr_auth_config) }}"
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/config/host/{{ _radarr_host_config.json.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
      Content-type: "application/json"
    body_format: json
    body: "{{ _radarr_desired_host_config }}"
    status_code: 202
  when: _radarr_desired_host_config != _radarr_host_config.json

    
    