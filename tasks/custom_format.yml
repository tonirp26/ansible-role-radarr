---
- name: Get current custom foramts.
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/customformat"
    method: GET
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    status_code: 200
  register: _radarr_custom_formats

- name: Ensure selected profile custom formats are present.
  ansible.builtin.set_fact:
    radarr_custom_formats: >-
      {{ radarr_anime_custom_formats if radarr_anime_profile | bool
          else radarr_movie_custom_formats }}

- name: Initialize custom format definition list.
  ansible.builtin.set_fact:
    _radarr_custom_formats_definitions: []

- name: Load TRaSH custom format definitions.
  ansible.builtin.set_fact:
    _radarr_custom_formats_definitions: >-
      {{
        _radarr_custom_formats_definitions
        + [lookup('ansible.builtin.template', role_path ~ '/files/custom_formats/' ~ item) | from_json]
      }}
  loop: "{{ radarr_custom_formats }}"
  loop_control:
    label: "{{ item }}"

- name: Convert TRaSH fields to Radarr custom format fields.
  ansible.builtin.set_fact:
    _radarr_custom_formats_specs: >-
      {{
        _radarr_custom_formats_specs | default({})
        | combine({
            item.0.name: (
              (_radarr_custom_formats_specs | default({}))[item.0.name] | default([])
            ) + [
              item.1 | combine({
                'fields': item.1.fields | dict2items(key_name='name', value_name='value')
              })
            ]
          })
      }}
  loop: "{{ _radarr_custom_formats_definitions | subelements('specifications') }}"
  loop_control:
    label: "{{ item.0.name }} / {{ item.1.name }}"

- name: Add missing TRaSH custom formats.
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/customformat"
    method: POST
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ item.name }}"
      includeCustomFormatWhenRenaming: "{{ item.includeCustomFormatWhenRenaming | default(false) }}"
      specifications: "{{ _radarr_custom_formats_specs[item.name] }}"
    status_code: [200, 201, 202]
  loop: "{{ _radarr_custom_formats_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in _radarr_custom_formats.json | map(attribute='name') | list
